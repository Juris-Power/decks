    <rect x="6" y="-18" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#0077CC" stroke-width="1.5"/>
    <!-- Windows row 2 -->
    <rect x="-14" y="-4" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#0077CC" stroke-width="1.5"/>
    <rect x="6" y="-4" width="8" height="8" rx="1" fill="#FFFFFF" stroke="#0077CC" stroke-width="1.5"/>
