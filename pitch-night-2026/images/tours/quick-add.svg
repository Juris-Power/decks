<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g stroke="#0077CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Overlay backdrop -->
    <rect x="40" y="30" width="240" height="100" rx="10" fill="#FFFFFF"/>
    <!-- Input field -->
    <rect x="56" y="48" width="208" height="22" rx="5" fill="#F8F9FA"/>
    <text x="64" y="62" font-family="ui-monospace, monospace" font-size="9" fill="#0077CC" stroke="none">Relancer Dupont mardi p1</text>
    <!-- Mic icon right of input -->
    <g transform="translate(252,53)" stroke-width="1.5">
      <rect x="0" y="0" width="6" height="9" rx="3" fill="#FFFFFF"/>
      <path d="M-2,7 C-2,11 7,11 7,7" stroke-width="1.2"/>
      <line x1="2.5" y1="11" x2="2.5" y2="14"/>
    </g>
    <!-- Chips below input -->
    <rect x="56" y="78" width="38" height="14" rx="3" fill="#FEE9E7"/>
    <text x="62" y="88" font-size="8" fill="#C62828" stroke="none">Haute</text>
    <rect x="100" y="78" width="56" height="14" rx="3" fill="#E5F3FB"/>
    <text x="106" y="88" font-size="8" fill="#0077CC" stroke="none">mardi 9h00</text>
    <rect x="162" y="78" width="46" height="14" rx="3" fill="#E0F7F5"/>
    <text x="168" y="88" font-size="8" fill="#00C0B5" stroke="none">relancer</text>
    <!-- Hint -->
    <text x="56" y="108" font-size="8" fill="#6B6B70" stroke="none">Tache : Dupont</text>
    <!-- Footer kbd shortcuts -->
    <rect x="56" y="116" width="32" height="10" rx="2" fill="#F0F0F0" stroke="#C8C8C8" stroke-width="1"/>
    <text x="60" y="124" font-family="ui-monospace, monospace" font-size="7" fill="#12181B" stroke="none">Entree</text>
    <text x="92" y="124" font-size="7" fill="#909090" stroke="none">creer</text>
    <rect x="120" y="116" width="22" height="10" rx="2" fill="#F0F0F0" stroke="#C8C8C8" stroke-width="1"/>
    <text x="125" y="124" font-family="ui-monospace, monospace" font-size="7" fill="#12181B" stroke="none">Esc</text>
    <text x="146" y="124" font-size="7" fill="#909090" stroke="none">annuler</text>
  </g>
