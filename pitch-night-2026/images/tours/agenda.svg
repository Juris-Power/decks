<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g transform="translate(160,80)" stroke="#0077CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Calendar body -->
    <rect x="-26" y="-20" width="52" height="46" rx="4"/>
    <!-- Calendar top bar -->
    <line x1="-26" y1="-8" x2="26" y2="-8"/>
    <!-- Calendar rings -->
    <line x1="-12" y1="-26" x2="-12" y2="-14"/>
    <line x1="12" y1="-26" x2="12" y2="-14"/>
    <!-- Calendar date grid -->
    <circle cx="-12" cy="2" r="1.5" fill="#0077CC" stroke="none"/>
    <circle cx="0" cy="2" r="1.5" fill="#0077CC" stroke="none"/>
    <circle cx="12" cy="2" r="1.5" fill="#0077CC" stroke="none"/>
    <circle cx="-12" cy="12" r="1.5" fill="#0077CC" stroke="none"/>
    <circle cx="0" cy="12" r="1.5" fill="#0077CC" stroke="none"/>
    <!-- Today highlight -->
    <rect x="6" y="7" width="12" height="10" rx="3" fill="#0077CC" stroke="none"/>
    <text x="12" y="15" text-anchor="middle" font-size="8" font-family="Arial, sans-serif" font-weight="bold" fill="#FFFFFF" stroke="none">15</text>
  </g>
</svg>
