<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g transform="translate(160,80)" stroke="#0077CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Porte ouverte : on entre dans son espace -->
    <rect x="-44" y="-34" width="52" height="68" rx="4"/>
    <path d="M8 -34 L34 -26 L34 42 L8 34 Z" fill="#0077CC" stroke="none" opacity="0.9"/>
    <circle cx="14" cy="4" r="2.5" fill="#FFFFFF" stroke="none"/>
    <!-- Trois étapes rapides : jalons cochés vers l'avant -->
    <g transform="translate(52,-8)">
      <circle cx="0" cy="0" r="9"/>
      <polyline points="-3.5,0 -1,3 4,-3.5" stroke-width="2"/>
      <circle cx="26" cy="0" r="9"/>
      <polyline points="22.5,0 25,3 30,-3.5" stroke-width="2"/>
      <circle cx="52" cy="0" r="9" stroke-dasharray="3 3"/>
    </g>
    <!-- Éclat de bienvenue -->
    <g transform="translate(-58,-44)" stroke-width="2">
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <line x1="-6" y1="0" x2="6" y2="0"/>
    </g>
  </g>
</svg>
