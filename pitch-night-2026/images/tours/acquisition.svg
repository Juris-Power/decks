<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g transform="translate(160,80)" stroke="#0077CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Magnet shape -->
    <path d="M-16,-28 L-16,-4 C-16,12 16,12 16,-4 L16,-28"/>
    <!-- Magnet poles (top caps) -->
    <rect x="-20" y="-28" width="12" height="8" rx="1" fill="#0077CC" stroke="none"/>
    <rect x="8" y="-28" width="12" height="8" rx="1" fill="#0077CC" stroke="none"/>
    <!-- Attraction lines -->
    <path d="M-8,12 C-8,18 8,18 8,12" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M-12,18 C-12,26 12,26 12,18" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Small dots being attracted -->
    <circle cx="-2" cy="22" r="2" fill="#0077CC" stroke="none"/>
    <circle cx="6" cy="26" r="1.5" fill="#0077CC" stroke="none"/>
    <circle cx="-6" cy="28" r="1.5" fill="#0077CC" stroke="none"/>
  </g>
</svg>
