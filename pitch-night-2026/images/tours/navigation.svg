<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g transform="translate(160,80)" stroke="#0077CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Compass icon -->
    <circle cx="0" cy="0" r="28"/>
    <circle cx="0" cy="0" r="2" fill="#0077CC" stroke="none"/>
    <!-- Compass needle -->
    <polygon points="0,-22 5,0 0,8 -5,0" fill="#0077CC" stroke="none" opacity="0.9"/>
    <polygon points="0,22 5,0 0,-8 -5,0" fill="#FFFFFF" stroke="#0077CC" stroke-width="1"/>
    <!-- Cardinal points -->
    <text x="0" y="-32" text-anchor="middle" font-size="8" font-family="Arial, sans-serif" font-weight="bold" fill="#0077CC" stroke="none">N</text>
  </g>
</svg>
