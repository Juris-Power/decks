<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <g transform="translate(160,80)" stroke="#0077CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Line chart with data points -->
    <line x1="-40" y1="30" x2="40" y2="30"/>
    <line x1="-40" y1="30" x2="-40" y2="-30"/>
    <!-- Grid lines -->
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#0077CC" stroke-width="0.5" opacity="0.3"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#0077CC" stroke-width="0.5" opacity="0.3"/>
    <!-- Trend line -->
    <polyline points="-30,20 -10,5 10,-15 30,-25" stroke="#0077CC" stroke-width="2.5"/>
    <!-- Data points -->
    <circle cx="-30" cy="20" r="3" fill="#0077CC" stroke="none"/>
    <circle cx="-10" cy="5" r="3" fill="#0077CC" stroke="none"/>
    <circle cx="10" cy="-15" r="3" fill="#0077CC" stroke="none"/>
    <circle cx="30" cy="-25" r="3" fill="#FFFFFF" stroke="#0077CC" stroke-width="2"/>
  </g>
</svg>
