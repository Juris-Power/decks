<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Signature — Juris-Connect · Documentation développeur</title>
    <!-- Page technique destinée aux intégrateurs cabinet : ne pas indexer. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Documentation de l'API publique de signature électronique Juris-Connect (eIDAS SES/AES/QES, webhooks, SDK iframe whitelabel)."
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <!--
      BIC-7 incrément 3 — Portail Redoc de l'API publique signature.
      Redoc (web component) rend la spec OpenAPI 3.1 servie en same-origin.
      Source de vérité : documentation/api-reference/openapi-signatures-v1.yaml
      (copiée ici via scripts/sync-openapi-to-public.sh).
      Redoc est servi par NOTRE domaine depuis le 2026-09-30 (F14,
      security-surface-program) : version 2.5.4 épinglée, provisionnée au
      build par scripts/fetch-redoc-assets.sh et contrôlée par son empreinte.
      Il venait de cdn.jsdelivr.net en `redoc@2` — une version non épinglée, et
      le dernier usage qui obligeait la CSP de tout le domaine à ouvrir
      jsDelivr. La page garde 'unsafe-inline' pour ses styles, que Redoc
      injecte à l'exécution.
    -->
    <redoc
      spec-url="/api-docs/openapi-signatures-v1.yaml"
      hide-download-button="false"
    ></redoc>
    <script src="/api-docs/redoc.standalone.js"></script>
  </body>
</html>
