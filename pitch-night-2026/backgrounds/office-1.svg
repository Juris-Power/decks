<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e4df"/>
      <stop offset="100%" style="stop-color:#d4cfc8"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb"/>
      <stop offset="60%" style="stop-color:#b8d4e8"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Window -->
  <rect x="1200" y="100" width="500" height="400" fill="url(#window)" stroke="#8b7355" stroke-width="20" rx="5"/>
  <line x1="1450" y1="100" x2="1450" y2="500" stroke="#8b7355" stroke-width="10"/>
  <line x1="1200" y1="300" x2="1700" y2="300" stroke="#8b7355" stroke-width="10"/>
  <!-- Bookshelf -->
  <rect x="100" y="200" width="300" height="500" fill="#5d4037"/>
  <rect x="110" y="210" width="280" height="80" fill="#d4a373"/>
  <rect x="110" y="300" width="280" height="80" fill="#d4a373"/>
  <rect x="110" y="390" width="280" height="80" fill="#d4a373"/>
  <rect x="110" y="480" width="280" height="80" fill="#d4a373"/>
  <rect x="110" y="570" width="280" height="80" fill="#d4a373"/>
  <!-- Books -->
  <rect x="120" y="220" width="30" height="60" fill="#1a237e"/>
  <rect x="155" y="220" width="25" height="60" fill="#b71c1c"/>
  <rect x="185" y="220" width="35" height="60" fill="#1b5e20"/>
  <rect x="225" y="220" width="20" height="60" fill="#4a148c"/>
  <rect x="250" y="220" width="40" height="60" fill="#e65100"/>
  <!-- Plant -->
  <ellipse cx="550" cy="700" rx="60" ry="80" fill="#2e7d32"/>
  <ellipse cx="580" cy="660" rx="50" ry="70" fill="#388e3c"/>
  <ellipse cx="520" cy="680" rx="40" ry="60" fill="#43a047"/>
  <rect x="530" y="750" width="40" height="80" fill="#5d4037"/>
</svg>
