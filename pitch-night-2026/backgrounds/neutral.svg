<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="neutral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feComposite in="SourceGraphic" in2="noise" operator="in"/>
    </filter>
  </defs>
  <!-- Gradient background -->
  <rect width="1920" height="1080" fill="url(#neutral)"/>
  <!-- Subtle pattern overlay -->
  <rect width="1920" height="1080" fill="white" opacity="0.03"/>
  <!-- Soft shapes for depth -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="white" opacity="0.05"/>
  <ellipse cx="1600" cy="800" rx="500" ry="400" fill="white" opacity="0.05"/>
  <ellipse cx="1000" cy="500" rx="600" ry="450" fill="white" opacity="0.03"/>
</svg>
