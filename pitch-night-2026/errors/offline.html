<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0077CC">
  <title>Connexion interrompue - Juris-Connect</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #F8F9FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #12181B;
    }

    .header {
      background: linear-gradient(135deg, #0077CC, #005799);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header img {
      /* Le logo garde son ratio : `logo-on-dark.png` est carre (724x726), et
         une hauteur seule sans `width: auto` le laissait a 40x36. */
      height: 40px;
      width: auto;
      /* Plus de `filter: brightness(0) invert(1)`. Il ecrasait le logo en
         silhouette BLANCHE PLEINE — et comme `logo.png` porte un fond opaque,
         le resultat etait un rectangle blanc sur le bandeau bleu. Vu a l'ecran
         le 2026-09-01. `logo-on-dark.png` est deja dessine pour un fond
         sombre : il n'a rien a filtrer. */
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }

    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      background: #F8F9FA;
      border: 2px solid #E8E8E8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      fill: #6B6B70;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #12181B;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #6B6B70;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0077CC, #005799);
      color: #FFFFFF;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 119, 204, 0.4);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Status indicator */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      font-size: 14px;
      color: #6B6B70;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #C62828;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot--online {
      background: #00C0B5;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Info section */
    .info-section {
      margin-top: 32px;
      padding: 20px 24px;
      background: #F8F9FA;
      border-radius: 8px;
    }

    .info-section p {
      font-size: 14px;
      color: #6B6B70;
      line-height: 1.6;
    }

    .info-section svg {
      width: 18px;
      height: 18px;
      fill: #00C0B5;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 24px 20px;
      border-top: 1px solid #E8E8E8;
    }

    .footer .contact {
      font-size: 14px;
      color: #6B6B70;
      margin-bottom: 8px;
    }

    .footer .contact a {
      color: #0077CC;
      text-decoration: none;
      font-weight: 500;
    }

    .footer .contact a:hover {
      text-decoration: underline;
    }

    .footer .copyright {
      font-size: 12px;
      color: #A0A0A0;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 22px; }
      .subtitle { font-size: 14px; }
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid #0077CC;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <header class="header">
    <img src="/images/logo-on-dark.png" alt="Juris-Connect" width="40" height="40">
  </header>

  <main class="main" role="main" aria-live="polite">
    <div class="card">
      <div class="icon-wrapper" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 8.98C20.93 5.9 16.69 4 12 4S3.07 5.9 0 8.98L12 21 24 8.98zM2.92 9.07C5.51 7.08 8.67 6 12 6s6.49 1.08 9.08 3.07l-1.43 1.43C17.5 8.94 14.86 8 12 8s-5.5.94-7.65 2.51L2.92 9.07zM12 19l-7.07-7.07C6.76 10.34 9.24 9.25 12 9.25s5.24 1.09 7.07 2.68L12 19z" opacity=".3"/>
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm7.07 7.93L12 19l-7.07-7.07C6.76 10.34 9.24 9.25 12 9.25s5.24 1.09 7.07 2.68z" opacity=".5"/>
          <line x1="2" y1="2" x2="22" y2="22" stroke="#C62828" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>

      <h1>Connexion interrompue</h1>
      <p class="subtitle">
        Impossible de joindre la plateforme Juris-Connect.<br>
        Vérifiez votre connexion internet.
      </p>

      <button class="retry-btn" onclick="window.location.reload()" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        Réessayer
      </button>

      <div class="status" id="connection-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Hors ligne</span>
      </div>

      <div class="info-section">
        <p>
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          Vos données sont en sécurité et seront disponibles dès le retour en ligne.
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="contact">
      <a href="mailto:support@juris-connect.fr">support@juris-connect.fr</a>
    </p>
    <p class="copyright">&copy; Juris-Connect &mdash; Votre cabinet en ligne</p>
  </footer>

  <script>
    (function() {
      var dot = document.getElementById('status-dot');
      var text = document.getElementById('status-text');

      window.addEventListener('online', function() {
        dot.classList.add('status-dot--online');
        text.textContent = 'Connexion rétablie, rechargement...';
        setTimeout(function() {
          window.location.reload();
        }, 1000);
      });

      window.addEventListener('offline', function() {
        dot.classList.remove('status-dot--online');
        text.textContent = 'Hors ligne';
      });
    })();
  </script>
</body>
</html>
